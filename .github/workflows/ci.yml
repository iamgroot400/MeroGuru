name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          # Throwaway key for test isolation only -- never used for real data.
          CREDENTIAL_ENCRYPTION_KEY: "vjywOZ4pu8QBzjAu-au9gSSfuAq9mTWae_hhxbZx6KA="
        run: |
          cd apps/api
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/apps/api" python -m pytest tests/ -v

  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install brain service dependencies
        run: |
          cd apps/brain
          pip install -r requirements-dev.txt
      - name: Run brain service tests
        run: |
          cd apps/brain
          PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/apps/brain" python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci
      - name: Run frontend tests
        run: |
          cd apps/web
          npm run test
      - name: Build frontend
        run: |
          cd apps/web
          npm run build
