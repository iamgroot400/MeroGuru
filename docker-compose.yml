services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: meroguru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: meroguru
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meroguru"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  brain:
    build:
      context: .
      dockerfile: apps/brain/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./apps/brain:/app/apps/brain
      - ./packages:/app/packages
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload --reload-dir /app/apps/brain --reload-dir /app/packages"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://meroguru:${POSTGRES_PASSWORD:-change-me}@postgres:5432/meroguru
      REDIS_URL: redis://redis:6379/0
      BRAIN_BASE_URL: http://brain:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brain:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/packages"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://meroguru:${POSTGRES_PASSWORD:-change-me}@postgres:5432/meroguru
      REDIS_URL: redis://redis:6379/0
      BRAIN_BASE_URL: http://brain:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brain:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./workers:/app/workers
    command: celery -A workers.celery_app worker --loglevel=info

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  ollama_data:
